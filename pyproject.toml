[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.12.0-beta.11"
description = "Kairos Studio: AI clipping that turns long videos into reviewed vertical shorts."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ZNTOff" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27,<1",  # OpenAI-compatible providers (OpenAI, Gemini, OpenRouter, Ollama...)
    "fastapi>=0.110",
    "faster-whisper>=1.0",
    "av>=18.1.0,<19",  # faster-whisper 1.2 calls av.open(metadata_errors=...), which av 16+ no longer accepts
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "uvicorn>=0.29",
    "yt-dlp>=2025.1.1",
]

[project.urls]
Homepage = "https://github.com/Zntoff/kairos-studio"
Changelog = "https://github.com/Zntoff/kairos-studio/blob/main/CHANGELOG.md"
Issues = "https://github.com/Zntoff/kairos-studio/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clipper = "clipper.cli:app"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["prompts/*.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
