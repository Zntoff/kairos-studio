# Production releases. Pushing a tag vX.Y.Z that points to a commit on main builds the three formats
# (Windows installer, portable ZIP and Docker bundle), runs the tests and creates a draft GitHub Release.
# Running it manually from the Actions tab (on dev or any branch) only builds the packages as artifacts.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the release source and Git history for secrets
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all .
  guard:
    name: Check tag, version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: check
        name: Verify
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main. Releases are tagged on main only."
              exit 1
            fi
            version=$(python scripts/check-version.py --tag "$GITHUB_REF_NAME" --changelog)
          else
            version=$(python scripts/check-version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer and portable ZIP
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Audit Windows package dependencies
        shell: pwsh
        run: |
          dotnet restore desktop/ClipperStudio/ClipperStudio.csproj --force-evaluate -p:NuGetAuditMode=all '-warnaserror:NU1900;NU1901;NU1902;NU1903;NU1904;NU1905'
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./release.ps1 -Target Desktop -ExpectedVersion $expected -OutputDirectory artifacts/windows
      - name: Native integration checks (offline)
        shell: pwsh
        run: dotnet run --project desktop/ClipperStudio.Tests -c Release
      - name: Installer round trip
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/windows/release-manifest.json -Raw | ConvertFrom-Json
          ./desktop/installer/test-install.ps1 -Installer "artifacts/windows/KairosStudio-$($manifest.version)-Setup-win-x64.exe" -Version $manifest.version
      - name: Installer version upgrade regression
        shell: pwsh
        run: ./desktop/installer/test-upgrade.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: artifacts/windows/*
          if-no-files-found: error

  docker:
    name: Docker image and bundle
    # After Windows, so a tag whose desktop build fails never publishes an image.
    needs: [guard, secrets, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build Docker image and downloadable bundle
        shell: pwsh
        run: |
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./release.ps1 -Target Docker -ExpectedVersion $expected -OutputDirectory artifacts/docker
      - name: Container regression checks
        run: |
          VERSION=$(python -c 'from clipper import __version__; print(__version__)')
          docker run --rm --entrypoint sh \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$PWD/scripts,dst=/app/scripts,readonly" \
            "kairos-studio:$VERSION" -ec 'pip install --quiet pytest && pytest -q -p no:cacheprovider'
      - name: Audit Python dependencies in the built image
        run: |
          version=$(python -c 'from clipper import __version__; print(__version__)')
          docker run --rm --entrypoint sh "kairos-studio:$version" -ec '
            pip list --format=freeze > /tmp/installed.txt
            sed "/^clipper==/Id" /tmp/installed.txt > /tmp/runtime.txt
            pip install --quiet pip-audit==2.10.1
            pip-audit -r /tmp/runtime.txt --no-deps --disable-pip'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-release
          path: artifacts/docker/*
          if-no-files-found: error
      - name: Scan OS packages before preparing a draft
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          version=$(python -c 'from clipper import __version__; print(__version__)')
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --pkg-types os \
            --severity HIGH,CRITICAL --format json --output artifacts/os-vulnerabilities.json "kairos-studio:$version"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/os-vulnerabilities.json").read_text())
          findings = [v for result in report.get("Results", []) for v in result.get("Vulnerabilities") or []]
          blocking = {(v["VulnerabilityID"], v["PkgName"]) for v in findings
                      if v["Severity"] == "CRITICAL" or v.get("FixedVersion")}
          if blocking:
              for advisory, package in sorted(blocking):
                  print(f"{advisory} in {package}")
              raise SystemExit("Critical or fixable high-severity OS advisories block draft creation.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('artifacts/os-vulnerabilities.json') != ''
        with:
          name: docker-os-audit
          path: artifacts/os-vulnerabilities.json
      - name: Publish the image to GitHub Packages
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/kairos-studio"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("$VERSION")
          if [[ "$VERSION" != *-beta.* ]]; then tags+=(latest); fi
          for tag in "${tags[@]}"; do
            docker tag "kairos-studio:$VERSION" "$image:$tag"
            docker push "$image:$tag"
          done

  draft:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [guard, secrets, windows, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Release notes from the changelog
        run: |
          python scripts/check-version.py --tag "$GITHUB_REF_NAME" --notes notes.md
          { echo; echo '---'; echo; sed "s/kairos-studio:latest/kairos-studio:${GITHUB_REF_NAME#v}/g" distribution/RELEASE-NOTES.md; } >> notes.md
      - name: Combined checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir combined
          cp artifacts/windows-release/*.exe artifacts/windows-release/*.zip artifacts/docker-release/*.zip combined/
          (cd combined && sha256sum * > SHA256SUMS.txt)
          flags=(--verify-tag --draft)
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" combined/* "${flags[@]}" \
            --title "EXE / ZIP / Docker · $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
