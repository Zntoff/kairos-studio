name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The three version declarations match
        run: python scripts/check-version.py
      - name: Pull requests to main carry a changelog section for their version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python scripts/check-version.py --changelog

  python:
    name: Python app (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-inter
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download FFmpeg and yt-dlp
        shell: pwsh
        run: ./desktop/setup.ps1
      - name: Build
        shell: pwsh
        run: dotnet build desktop/ClipperStudio/ClipperStudio.csproj -c Release
      - name: Integration tests (offline)
        shell: pwsh
        run: dotnet run --project desktop/ClipperStudio.Tests -c Release
